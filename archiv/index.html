<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Archiv – F1-Briefing</title>
<style>
/* Same dark infographic design as index.html */
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/barlow-500.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/barlow-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/barlow-condensed-800.woff2) format('woff2')}
:root{--bg:#0b0c10;--fg:#f2f2f2;--soft:#d8d8d8;--muted:#9aa0aa;--line:#23262e;--border:#262a33;--card:#15171d;--card2:#1d2027;--red:#e10600;--accent:#ff2a1f;--bar:#3a3e48;--bar-em:#e10600;--cond:'Barlow Condensed','Arial Narrow',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font:17px/1.55 'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:radial-gradient(ellipse 900px 600px at 100% 0%,rgba(225,6,0,.24),transparent 70%) no-repeat,var(--bg);min-height:100vh}
main{max-width:760px;margin:0 auto;padding:34px 18px 44px}
a{color:var(--accent)}
h1{font-family:var(--cond);font-weight:800;font-size:2.6rem;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin:0;padding:0 0 14px;border-bottom:4px solid var(--red)}
h1::before{content:"Formel 1 · Briefing";display:block;font-weight:600;font-size:.95rem;letter-spacing:.35em;color:var(--muted);margin-bottom:6px}
.summary{color:var(--soft);font-size:1.05rem;font-weight:500;margin:14px 0 24px}
h2{display:flex;align-items:center;gap:10px;font-family:var(--cond);font-weight:700;font-size:1.3rem;line-height:1.2;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0}
h2::before{content:"";flex:none;width:5px;height:1.05em;background:var(--accent);border-radius:2px}
section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:0 0 16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
p{margin:12px 0 0}
table{width:100%;border-collapse:collapse;font-size:.97rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-family:var(--cond);color:var(--muted);font-weight:600;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;border-bottom-color:var(--border)}
td:first-child{font-weight:600}
footer{border-top:1px solid var(--border);margin-top:24px;padding-top:14px;color:#6f7580;font-size:.85rem}
footer a{color:var(--muted)}
footer .legal a{color:#6f7580;text-decoration:none}
footer .legal a:hover{color:var(--muted);text-decoration:underline}
td a{color:var(--fg);text-decoration:none;font-weight:600}td a:hover{color:var(--accent);text-decoration:underline}
.track{display:block;color:var(--muted);font-size:.88rem}
.back{display:inline-flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);text-decoration:none;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 14px}
.back:hover{border-color:var(--red)}
.back::before{content:"←";color:var(--accent)}
@media (max-width:560px){
 body{font-size:16px}
 main{padding:22px 12px 36px}
 h1{font-size:2.05rem}
 h1::before{font-size:.8rem;letter-spacing:.28em}
 section{padding:15px 14px;border-radius:14px}
 th,td{padding:7px 5px}
}
</style>
</head>

</body>
</html>
