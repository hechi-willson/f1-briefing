name: Notify Arno

# Fires only after GitHub Pages has finished deploying the new version,
# so the webhook never arrives before the page is live.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Call webhook
        env:
          WEBHOOK_URL: ${{ secrets.ARNO_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.ARNO_WEBHOOK_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_TIME: ${{ github.event.workflow_run.head_commit.timestamp }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "Secrets missing, skipped."; exit 0
          fi
          payload=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$SHA" \
            --arg message "$COMMIT_MSG" \
            --arg timestamp "$COMMIT_TIME" \
            --arg page "https://hechi-willson.github.io/f1-briefing/" \
            --arg commit_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA" \
            '{event:"f1-briefing-update", repo:$repo, sha:$sha, message:$message, timestamp:$timestamp, page:$page, commit_url:$commit_url}')
          curl -fsS --retry 3 -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" -o /dev/null -w "HTTP %{http_code}\n"
